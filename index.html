<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track your daily habits, weekly tasks and mood. English and Arabic.">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F172A'/%3E%3Crect x='12' y='12' width='17' height='17' rx='4' fill='%237C5CFF'/%3E%3Crect x='35' y='12' width='17' height='17' rx='4' fill='%233B82F6'/%3E%3Crect x='12' y='35' width='17' height='17' rx='4' fill='%232DD4BF'/%3E%3Cpath d='m36 44 5 5 10-11' fill='none' stroke='%2334D399' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="config.js"></script>
<title>Personal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a night-desk dashboard that always fits the screen. Header + tabs, one quiet stats strip,
   then the working surface: full month grid on wide screens, one week of it on phones. Dark-only by design. */
:root {
  --bg: #0F172A;
  --panel: #182036;
  --panel-2: #202A43;
  --cell: #243050;
  --line: #2E3A55;
  --fg: #E6EDF7;
  --muted: #8FA0BC;
  --faint: #5C6B85;
  --w1: #7C5CFF; --w2: #3B82F6; --w3: #2DD4BF; --w4: #EC4899; --w5: #34D399;
  --amber: #F59E0B;
  --danger: #F87171;
  --f-display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", Arial, Helvetica, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow-x: hidden; }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 16px; }
.wrap[dir="rtl"] { --f-display: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; --f-body: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; --f-mono: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; font-family: var(--f-body); }
.wrap[dir="rtl"] * { letter-spacing: 0 !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--w3); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.subline { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.subline #dateLine { color: var(--fg); font-weight: 500; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(21px, 3vw, 28px); margin: 0; line-height: 1.1; text-wrap: balance; }
.wrap[dir="rtl"] .brand h1 { font-weight: 700; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-s="saved"]::before { background: var(--w5); }
.status[data-s="saving"]::before { background: var(--amber); }
.status[data-s="error"]::before { background: var(--danger); }
.head-btns { display: flex; align-items: center; gap: 8px; flex: none; }
.helpbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 16px; font-weight: 700; color: var(--muted); font-family: var(--f-display); }
.helpbtn:hover { color: var(--fg); border-color: var(--w3); }
.langbtn { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 40px; }
.langbtn:hover { border-color: var(--w3); }
.langbtn [lang="ar"] { font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-radius: 12px; padding: 4px; gap: 4px; max-width: 420px; }
.tabs button { border: 0; background: none; padding: 9px 10px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.tabs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabs button[aria-selected="true"] svg { color: var(--w3); }
.tabs button[aria-selected="true"] { background: var(--cell); color: var(--fg); }
@media (max-width: 640px) {
  .tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; max-width: none; border-radius: 16px 16px 0 0; padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 -1px 0 var(--line), 0 -10px 30px rgba(0,0,0,.35); }
  .tabs button { flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 4px; min-height: 52px; }
  .tabs svg { width: 22px; height: 22px; }
  .tabs button[aria-selected="true"] { background: none; color: var(--fg); }
  .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* toolbar: period + stats */
.toolbar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
@media (max-width: 860px) { .toolbar { grid-template-columns: minmax(0, 1fr); } }
.period { display: flex; align-items: center; gap: 4px; background: var(--panel); border-radius: var(--r); padding: 6px; }
.period .lbl { flex: 1; min-width: 10.5rem; text-align: center; font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.2; }
.period .sub { display: block; font-family: var(--f-body); font-size: 11.5px; color: var(--muted); font-weight: 500; }
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.iconbtn:hover { background: var(--cell); color: var(--fg); }
.nowbtn { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--cell); border: 0; border-radius: 8px; padding: 0 10px; height: 32px; }
.nowbtn:hover { color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border-radius: var(--r); padding: 10px 4px; }
.stat { padding: 2px 14px; min-width: 0; border-inline-start: 1px solid var(--line); }
.stat:first-child { border-inline-start: 0; }
.stat .k { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-family: var(--f-mono); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-inline-start: 3px; }
@media (max-width: 520px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; }
  .stat:nth-child(3) { border-inline-start: 0; }
  .stat .v { font-size: 19px; }
}

.panel { background: var(--panel); border-radius: var(--r); min-width: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.panel-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 0; }
.hint { font-size: 12px; color: var(--muted); }
.loading { opacity: 0.5; pointer-events: none; }

/* week-of-month chips (phones) */
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chip { border: 0; border-radius: 9px; padding: 7px 4px; background: var(--cell); color: var(--muted); font-size: 12.5px; font-weight: 600; font-family: var(--f-mono); min-height: 36px; position: relative; }
.chip::after { content: ""; position: absolute; inset-inline: 30%; bottom: 4px; height: 3px; border-radius: 2px; background: var(--wk); opacity: .7; }
.chip[aria-pressed="true"] { background: var(--wk); color: #0F172A; }
.chip[aria-pressed="true"]::after { display: none; }

/* ---------- habit grid ---------- */
.grid { display: grid; gap: 4px; align-items: center; min-width: 0; }
.gname { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline-end: 6px; min-width: 0; }
.gname.empty { color: var(--faint); font-style: italic; }
.gcell { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
.gin { width: 100%; min-width: 0; background: transparent; border: 0; border-radius: 6px; padding: 3px 6px 1px; margin-inline-start: -6px; font-size: 13px; text-overflow: ellipsis; }
.gin:hover { background: var(--panel-2); }
.gin:focus { background: var(--cell); outline: none; box-shadow: inset 0 0 0 1.5px var(--w3); }
.gin::placeholder { color: var(--faint); font-style: italic; }
.gadd { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 2px; }
.gtime { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; max-width: 100%; border: 0; background: none; border-radius: 5px; padding: 1px 6px 2px; margin-inline-start: -6px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--w3); white-space: nowrap; overflow: hidden; }
.gtime.none { font-family: var(--f-body); font-weight: 500; color: var(--faint); }
.gtime:hover, .gtime[aria-expanded="true"] { background: var(--panel-2); color: var(--fg); }
.gtime svg, .tlabel svg { width: 11px; height: 11px; flex: none; }
.gtimeedit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 4px; font-size: 12.5px; color: var(--muted); }
.gtimeedit b { color: var(--fg); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
.tpick { display: inline-flex; align-items: center; gap: 4px; }
.tpick .colon { color: var(--muted); font-weight: 600; }
.tsel { background: var(--cell); border: 0; border-radius: 7px; padding: 0 6px; min-height: 34px; font-family: var(--f-mono); font-size: 13px; color: var(--fg); }
.tsel:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--w3); }
.tlink { border: 0; background: none; border-radius: 7px; padding: 6px 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tlink:hover { background: var(--panel-2); color: var(--fg); }
.tlink.primary { color: var(--w3); }
.tlabel { display: inline-flex; align-items: center; gap: 5px; }
.wrap[dir="rtl"] .gin, .wrap[dir="rtl"] .hname, .wrap[dir="rtl"] .ttext { text-align: right; }
.gadd input { flex: 1; min-width: 0; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.gadd input:focus { outline: none; border-style: solid; border-color: var(--w3); }
.gadd input::placeholder { color: var(--muted); }
.gadd .btn { min-height: 38px; }
.glab { font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: end; padding-inline-end: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh { text-align: center; border-radius: 7px 7px 3px 3px; padding: 3px 0 2px; background: var(--wk); color: #fff; font-family: var(--f-mono); font-weight: 600; font-size: 12px; line-height: 1.15; min-width: 0; overflow: hidden; }
.dh small { display: block; font-family: var(--f-body); font-size: 9.5px; font-weight: 500; opacity: 0.85; }
.wrap[dir="rtl"] .dh small { font-size: 10.5px; }
.dh.today { box-shadow: 0 0 0 2px var(--fg); }
.tick { aspect-ratio: 1; width: 100%; max-width: 42px; justify-self: center; border-radius: 7px; border: 0; background: var(--cell); padding: 0; display: grid; place-items: center; min-width: 0; transition: background-color .12s, transform .12s; }
.tick:hover { box-shadow: inset 0 0 0 1.5px var(--wk); }
.tick:active { transform: scale(.92); }
.tick[aria-pressed="true"] { background: var(--wk); }
.tick[aria-pressed="true"]::after { content: ""; width: 38%; height: 20%; border-inline-start: 2px solid #0F172A; border-bottom: 2px solid #0F172A; transform: translateY(-12%) rotate(-45deg); }
.wrap[dir="rtl"] .tick[aria-pressed="true"]::after { transform: translateY(-12%) rotate(45deg); }
.tick.today { box-shadow: inset 0 0 0 1.5px var(--muted); }
.tick.future:not([aria-pressed="true"]) { opacity: 0.45; }
.gcount { text-align: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.gsep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 4px 0; }
.rate { width: 100%; min-width: 0; height: 30px; text-align: center; border-radius: 7px; border: 0; background: var(--cell); font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; padding: 0; }
.rate::placeholder { color: var(--faint); }
.rate.mood { color: var(--w4); } .rate.mot { color: var(--w2); }
.rate:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--fg); }
.rate.bad { box-shadow: inset 0 0 0 1.5px var(--danger); }
.gempty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 10px 0; }

/* ---------- habits list (manage + stats) ---------- */
.habits { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 8px; }
.hab { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--bg); border-radius: 10px; min-width: 0; }
.hab-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hname { flex: 1; min-width: 0; background: transparent; border: 0; border-radius: 6px; padding: 5px 6px; margin-inline-start: -6px; font-size: 14px; font-weight: 500; }
.hname:hover { background: var(--panel); }
.hname:focus { background: var(--panel-2); outline: none; }
.hname::placeholder { color: var(--faint); font-style: italic; font-weight: 400; }
.hdel { flex: none; border: 0; background: none; color: var(--faint); font-size: 17px; line-height: 1; min-width: 32px; height: 32px; border-radius: 8px; padding: 0 6px; }
.hdel:hover { color: var(--danger); background: var(--panel); }
.hdel.confirm { color: #fff; background: var(--danger); font-size: 12px; font-weight: 600; }
.track { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--w5); border-radius: 3px; }
.hab-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.goal { background: var(--panel); border: 0; border-radius: 7px; padding: 4px 6px; font-size: 12px; color: var(--fg); max-width: 100%; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--w5) 18%, transparent); color: var(--w5); }
.pill.behind { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.pill.idle { background: var(--panel); color: var(--muted); }
.streak { color: var(--amber); font-weight: 600; }
.addform { display: flex; gap: 8px; }
.addform input { flex: 1; min-width: 0; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.addform input:focus { outline: none; border-style: solid; border-color: var(--w3); }
.addform input::placeholder { color: var(--muted); }
.btn { border: 0; background: var(--cell); border-radius: 10px; font-size: 13.5px; font-weight: 600; padding: 0 16px; min-height: 42px; }
.btn:hover { background: var(--line); }

/* charts */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart { background: var(--bg); border-radius: 10px; padding: 10px 12px 6px; min-width: 0; }
.chart h3 { margin: 0; font-size: 13px; font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 2px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-inline-end: 5px; background: var(--c); }
.chart svg { display: block; width: 100%; height: 160px; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-mono); }
.chart .gl { stroke: var(--line); stroke-width: 1; }

/* ---------- tasks ---------- */
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dp { border: 0; background: var(--panel); border-radius: 10px; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); min-width: 0; position: relative; }
.dp b { font-family: var(--f-mono); font-size: 16px; color: var(--fg); font-weight: 600; }
.dp span { font-size: 11px; }
.dp::after { content: ""; position: absolute; bottom: 4px; width: 14px; height: 3px; border-radius: 2px; background: var(--acc); opacity: var(--o, .25); }
.dp[aria-pressed="true"] { background: var(--acc); color: #0F172A; }
.dp[aria-pressed="true"] b { color: #0F172A; }
.dp[aria-pressed="true"]::after { background: #0F172A; }
.dp.today span { font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1180px) { .week { grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); } }
.day { background: var(--panel); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; container-type: inline-size; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--acc); }
.day-h { padding: 10px 12px 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; border-top: 4px solid var(--acc); }
.day-h .tag { font-size: 10.5px; font-weight: 700; color: #0F172A; background: var(--acc); border-radius: 999px; padding: 1px 7px; margin-inline-start: 4px; }
.day-h b { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.day-h span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.day-stat { padding: 0 12px 8px; display: flex; align-items: center; gap: 8px; }
.day-stat .pct { font-family: var(--f-mono); font-weight: 600; font-size: 15px; color: var(--acc); min-width: 2.8em; }
.day-stat .track { flex: 1; }
.day-stat .track i { background: var(--acc); }
.day-stat .cnt { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.day-stat .cnt-s { display: none; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.day-empty { padding: 0 12px 6px; font-size: 12px; color: var(--faint); }
.tasks { list-style: none; margin: 0; padding: 0 6px; display: flex; flex-direction: column; gap: 2px; }
.task { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; gap: 2px; border-radius: 8px; }
.task:hover { background: var(--panel-2); }
.chk { width: 32px; height: 32px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.chk::before { content: ""; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); box-sizing: border-box; grid-area: 1 / 1; }
.chk[aria-pressed="true"]::before { background: var(--acc); border-color: var(--acc); }
.chk[aria-pressed="true"]::after { content: ""; grid-area: 1 / 1; width: 8px; height: 4px; border-inline-start: 2px solid #0F172A; border-bottom: 2px solid #0F172A; transform: translateY(-1px) rotate(-45deg); }
.wrap[dir="rtl"] .chk[aria-pressed="true"]::after { transform: translateY(-1px) rotate(45deg); }
.ttext { border: 0; background: transparent; padding: 7px 2px; width: 100%; min-width: 0; font-size: 14px; }
.ttext:focus { outline: none; }
.task.done .ttext { color: var(--faint); text-decoration: line-through; }
.del { border: 0; background: none; color: var(--faint); font-size: 17px; line-height: 1; width: 32px; height: 32px; border-radius: 8px; opacity: 0; }
.task:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { color: var(--danger); background: var(--bg); }
@media (hover: none) { .del { opacity: .8; } }
.add { display: flex; padding: 6px 10px 4px; }
.add input { flex: 1; min-width: 0; background: var(--bg); border: 1px dashed var(--line); border-radius: 9px; padding: 9px 10px; font-size: 13.5px; }
.add input:focus { outline: none; border-style: solid; border-color: var(--acc); }
.add input::placeholder { color: var(--muted); }
.full { font-size: 12px; color: var(--muted); padding: 6px 12px; }
.carry { margin: 4px 10px 0; border: 0; background: none; color: var(--acc); font-size: 12.5px; font-weight: 600; text-align: start; padding: 6px 2px; }
.carry:hover { text-decoration: underline; }

.mind { margin-top: auto; padding: 10px 12px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.mind label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); min-width: 0; }
.mind label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mind .rate { color: var(--acc); height: 36px; font-size: 14px; }
.mind .score { text-align: end; font-size: 11px; font-weight: 600; color: var(--muted); }
.mind .score b { display: block; font-family: var(--f-mono); font-size: 16px; color: var(--acc); }
.mind-h { grid-column: 1 / -1; font-size: 11.5px; font-weight: 600; color: var(--acc); margin-top: 2px; }
/* narrow day cards (the 7-across week on laptops): stack everything so nothing is clipped */
@container (max-width: 235px) {
  .day-h { flex-direction: column; align-items: flex-start; }
  .day-stat .cnt { display: none; }
  .day-stat .cnt-s { display: inline; }
  .day-stat .pct { min-width: 0; }
  .mind { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .mind label { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .mind label .rate { width: 3.4rem; flex: none; height: 32px; }
  .mind .score { display: flex; justify-content: space-between; align-items: baseline; text-align: start; font-size: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
  .mind .score b { display: inline; }
  .carry { font-size: 12px; }
}

/* ---------- year ---------- */
.ygrid { display: grid; grid-template-columns: minmax(0, 4.2rem) repeat(31, minmax(0, 1fr)); gap: 3px; align-items: center; }

.ym { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline-end: 4px; border: 0; background: none; text-align: start; padding-block: 0; }
.ym:hover { color: var(--fg); }
.yd { aspect-ratio: 1; min-width: 0; border-radius: 3px; background: var(--cell); border: 0; padding: 0; }
.yd.none { background: transparent; }
.yd.l1 { background: color-mix(in srgb, var(--w3) 28%, var(--cell)); }
.yd.l2 { background: color-mix(in srgb, var(--w3) 52%, var(--cell)); }
.yd.l3 { background: color-mix(in srgb, var(--w3) 76%, var(--cell)); }
.yd.l4 { background: var(--w3); }
.yd.fut { opacity: .35; }
.yd.today { box-shadow: 0 0 0 1.5px var(--fg); }
.yhead { font-size: 10px; color: var(--muted); text-align: center; font-family: var(--f-mono); min-width: 0; overflow: hidden; }
.ylegend { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.ylegend .yd { width: 12px; }
@media (max-width: 520px) { .ygrid { gap: 2px; } .yhead { font-size: 8px; } .yd { border-radius: 2px; } .ym { font-size: 11px; } }

.note { font-size: 12.5px; color: var(--muted); max-width: 70ch; margin: 0; }

/* ---------- accounts ---------- */
.acct { position: relative; }
.acctbtn { height: 40px; min-width: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

  .acctbtn:not(.signed) { width: 40px; padding: 0; }

}
.acctbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acctbtn .ini { width: 100%; height: 100%; display: grid; place-items: center; background: var(--w1); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.acct-menu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; z-index: 60; width: min(260px, calc(100vw - 32px)); box-sizing: border-box; background: var(--panel-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 0 0 1px var(--line); }
.acct-who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.acct-who b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-who span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .acct-menu { position: fixed; top: 64px; inset-inline: 16px; width: auto; } }
#gate { position: fixed; inset: 0; z-index: 110; background: rgba(4, 7, 16, 0.82); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.gate-card { box-sizing: border-box; width: min(400px, 100%); background: var(--panel); border-radius: 20px; padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px var(--line); }
.gate-logo { display: grid; grid-template-columns: repeat(2, 18px); gap: 5px; margin-bottom: 4px; }
.gate-logo i { width: 18px; height: 18px; border-radius: 5px; }
.gate-card h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; text-wrap: balance; }
.gate-card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); max-width: 32ch; }
.gbtn { margin-top: 8px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #fff; color: #1F1F1F; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
.gbtn:hover { background: #F1F3F4; }
.gbtn:disabled { opacity: .6; cursor: progress; }
.gbtn svg { width: 20px; height: 20px; }
.gate-err { color: var(--danger) !important; font-size: 13px !important; }
.gate-note { font-size: 12px !important; color: var(--faint) !important; }
#gGuest { color: var(--fg); font-size: 14px; padding: 10px 12px; }

/* ---------- guided tour ---------- */
#tour { position: fixed; inset: 0; z-index: 100; }
.tour-catch { position: absolute; inset: 0; }
.tour-spot { position: fixed; border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 2px var(--w3), 0 0 0 9999px rgba(4, 7, 16, 0.76); transition: top .28s ease, left .28s ease, width .28s ease, height .28s ease; }
.tour-spot.none { width: 0; height: 0; top: 50%; left: 50%; box-shadow: 0 0 0 9999px rgba(4, 7, 16, 0.8); }
.tour-card { position: fixed; box-sizing: border-box; width: min(370px, calc(100vw - 32px)); background: var(--panel-2); border-radius: 16px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px var(--line); transition: top .28s ease, left .28s ease; }
.tour-count { font-size: 11.5px; font-weight: 600; color: var(--w3); }
.tour-card h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.tour-card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--fg); opacity: .9; }
.tour-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.tour-foot .tlink { padding-inline: 4px; }
.tour-dots { flex: 1; display: flex; justify-content: center; gap: 4px; min-width: 0; }
.tour-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .2s, background-color .2s; }
.tour-dots i.on { width: 16px; background: var(--w3); }
.tbtn { border: 0; border-radius: 9px; min-height: 38px; padding: 0 14px; font-size: 13.5px; font-weight: 600; background: var(--cell); color: var(--fg); }
.tbtn:hover { background: var(--line); }
.tbtn.primary { background: var(--w3); color: #0F172A; }
.tbtn.primary:hover { background: color-mix(in srgb, var(--w3) 85%, #fff); }
.tbtn[hidden] { display: none; }
@media (max-width: 400px) { .tour-dots { display: none; } .tour-foot .tlink { margin-inline-end: auto; } }
@media (prefers-reduced-motion: reduce) { .tour-spot, .tour-card { transition: none; } }

/* ---------- today card ---------- */
.today-panel { background: linear-gradient(180deg, color-mix(in srgb, var(--w3) 9%, var(--panel)) 0%, var(--panel) 120px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--w3) 22%, transparent); }
.today-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.today-h h2 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0 0 2px; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bg { stroke: var(--cell); }
.ring .fg { stroke: var(--w3); transition: stroke-dashoffset .35s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 6px; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 12px; background: var(--bg); text-align: start; transition: background-color .15s; }
.trow:hover { background: var(--panel-2); }
.trow .tcheck { width: 24px; height: 24px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--muted); display: grid; place-items: center; transition: background-color .15s, box-shadow .15s; }
.trow[aria-pressed="true"] .tcheck { background: var(--w3); box-shadow: none; }
.trow[aria-pressed="true"] .tcheck::after { content: ""; width: 9px; height: 5px; border-inline-start: 2.2px solid #0F172A; border-bottom: 2.2px solid #0F172A; transform: translateY(-1px) rotate(-45deg); }
.wrap[dir="rtl"] .trow[aria-pressed="true"] .tcheck::after { transform: translateY(-1px) rotate(45deg); }
.trow .tn { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: start; }
.wrap[dir="rtl"] .trow .tn { text-align: right; }
.trow[aria-pressed="true"] .tn { color: var(--muted); }
.trow .tt { flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.trow .tt.late { color: var(--amber); }
.trow .tnext { flex: none; font-size: 10.5px; font-weight: 700; color: #0F172A; background: var(--w3); border-radius: 999px; padding: 2px 7px; }
.trow.is-next { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--w3) 55%, transparent); }
.feel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding-top: 4px; }
@media (max-width: 760px) { .feel { grid-template-columns: minmax(0, 1fr); } }
.feel-row { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.feel-row .fl { font-size: 12.5px; font-weight: 600; color: var(--c); }
.seg { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.seg button { border: 0; border-radius: 8px; min-height: 36px; padding: 0; background: var(--bg); color: var(--muted); font-family: var(--f-mono); font-size: 13px; font-weight: 600; min-width: 0; }
.seg button:hover { color: var(--fg); background: var(--panel-2); }
.seg button.lit { background: color-mix(in srgb, var(--c) 28%, var(--bg)); color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--c); color: #0F172A; }

/* ---------- habit rows ---------- */
.hrows { display: flex; flex-direction: column; gap: 6px; }
.hrow { background: var(--bg); border-radius: 12px; min-width: 0; }
.hrow-main { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 12px; }
.hrow-name { flex: 1 1 13rem; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hrow-name b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap[dir="rtl"] .hrow-name b { text-align: right; }
.hrow-name b.empty { color: var(--faint); font-style: italic; font-weight: 500; }
.hrow-name small { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.hrow-name small svg { width: 11px; height: 11px; }
.hrow-prog { flex: 0 1 16rem; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow-prog .track { flex: 1; min-width: 3rem; }
.hrow-end { display: flex; align-items: center; gap: 8px; flex: none; margin-inline-start: auto; }
.editbtn { border: 0; background: var(--panel); color: var(--fg); border-radius: 8px; min-height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 600; }
.editbtn:hover, .editbtn[aria-expanded="true"] { background: var(--cell); }
.hrow-edit { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
.hrow-edit label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); min-width: 0; max-width: 100%; }
.hrow-edit .hname { margin: 0; background: var(--panel); padding: 0 10px; min-height: 34px; width: 14rem; max-width: 100%; }
.hrow-edit .goal { min-height: 34px; padding: 0 8px; }
.hrow-edit .hdel { min-height: 34px; padding: 0 12px; font-size: 12.5px; font-weight: 600; margin-inline-start: auto; background: var(--panel); color: var(--danger); }
.hrow-edit .hdel.confirm { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div class="wrap">
  <header class="top">

    <button role="tab" id="tab-tasks" aria-selected="false" aria-controls="view-tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6.5 1.8 1.8L9 5"/><path d="M12 7h8"/><path d="m4 13.5 1.8 1.8L9 12"/><path d="M12 14h8"/><path d="M12 20h8"/><circle cx="6.3" cy="20" r="1.3"/></svg><span data-i18n="tasks">Tasks</span></button>
    <button role="tab" id="tab-year" aria-selected="false" aria-controls="view-year"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg><span data-i18n="year">Year</span></button>

        <div class="chart"><h3 data-i18n="chartMood">Mood and motivation</h3><div class="legend"><span><i style="--c:var(--w4)"></i><span data-i18n="mood">Mood</span></span><span><i style="--c:var(--w2)"></i><span data-i18n="motivation">Motivation</span></span></div><div id="cMood"></div></div>

    document.documentElement.lang = LANG; document.title = tr("app");
    wrap.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
    wrap.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", tr(el.dataset.i18nAria)));
    wrap.querySelectorAll("[data-i18n-ph]").forEach(el => el.setAttribute("placeholder", tr(el.dataset.i18nPh)));
    const lb = $("#langBtn");
    lb.innerHTML = LANG === "ar" ? '<span lang="en">English</span>' : '<span lang="ar">العربية</span>';
    lb.setAttribute("aria-label", LANG === "ar" ? "Switch to English" : "التبديل إلى العربية");
    const st = $("#status"); setStatus(st.dataset.s || "loading", st.dataset.msg || undefined);
    localizeDigits(wrap);
  }
  function localizeDigits(node) {
    if (LANG !== "ar" || !node) return;
    if (node.nodeType === 3) { if (/[0-9]/.test(node.nodeValue)) node.nodeValue = toAr(node.nodeValue); return; }
    if (node.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(node.tagName)) return;
    const tw = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest("textarea, script, style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; while (tw.nextNode()) list.push(tw.currentNode);
    list.forEach(n => { if (/[0-9]/.test(n.nodeValue)) n.nodeValue = toAr(n.nodeValue); });
  }
  new MutationObserver(muts => {
    if (LANG !== "ar") return;
    muts.forEach(m => { if (m.type === "characterData") localizeDigits(m.target); else m.addedNodes.forEach(localizeDigits); });
  }).observe($(".wrap"), { childList: true, subtree: true, characterData: true });

  // ================= guided tour =================
  const TOUR_STEPS = [
    { tab: "habits", target: null },
    { tab: "habits", target: "#tList" },
    { tab: "habits", target: "#tFeel" },
    { tab: "habits", target: "#hPanel" },
    { tab: "habits", target: "#hAddForm" },
    { tab: "tasks", target: "#tWeek .day" },
    { tab: "year", target: "#yPanel" },
    { tab: "habits", target: "#langBtn" },
    { tab: "habits", target: "#helpBtn" },
  ];
  let tourIdx = -1, tourPrevFocus = null;
  const tourEl = $("#tour"), spot = $("#tourSpot"), card = $("#tourCard");
  function tourSeen() {
    try { if (localStorage.getItem("pt:tourDone") === "1") return true; } catch (e) {}
    return !!(docs.settings && docs.settings.data && docs.settings.data.tourDone);
  }
  function startTour() { tourPrevFocus = document.activeElement; tourEl.hidden = false; showStep(0); }
  function endTour() {
    tourIdx = -1; tourEl.hidden = true;
    try { localStorage.setItem("pt:tourDone", "1"); } catch (e) {}
    const st = docs.settings;
    if (st && st.loaded && !st.data.tourDone) { st.data.tourDone = true; change("settings"); }
    if (view.tab !== "habits") setTab("habits");
    window.scrollTo({ top: 0 });
    const f = $("#helpBtn"); if (f) f.focus();
  }
  function showStep(i) {
    tourIdx = i;
    const st = TOUR_STEPS[i], txt = L().TOUR[i], last = i === TOUR_STEPS.length - 1;
    if (view.tab !== st.tab) setTab(st.tab);
    $("#tourCount").textContent = tr("tourOf", i + 1, TOUR_STEPS.length);
    $("#tourTitle").textContent = txt[0];
    $("#tourBody").textContent = txt[1];
    $("#tourSkip").textContent = tr("tourSkip"); $("#tourSkip").hidden = last;
    $("#tourBack").textContent = tr("tourBack"); $("#tourBack").hidden = i === 0;
    $("#tourNext").textContent = last ? tr("tourDone") : tr("tourNext");
    $("#tourDots").innerHTML = TOUR_STEPS.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("");
    const el = st.target && document.querySelector(st.target);
    if (el) {
      const r = el.getBoundingClientRect(), tall = r.height > innerHeight * 0.5;
      const y = window.scrollY + r.top - (tall ? 72 : (innerHeight - r.height) / 2 - 60);
      window.scrollTo({ top: Math.max(0, y) });
    } else window.scrollTo({ top: 0 });
    requestAnimationFrame(() => requestAnimationFrame(placeTour));
    $("#tourNext").focus({ preventScroll: true });
  }
  function placeTour() {
    if (tourIdx < 0) return;
    const st = TOUR_STEPS[tourIdx], el = st.target && document.querySelector(st.target);
    const vw = innerWidth, vh = innerHeight, pad = 8, gap = 14;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    if (!el) {
      spot.className = "tour-spot none"; spot.removeAttribute("style");
      card.style.left = `${(vw - cw) / 2}px`; card.style.top = `${Math.max(16, (vh - ch) / 2)}px`; return;
    }
    const r = el.getBoundingClientRect();
    const top = Math.max(6, r.top - pad);
    let bot = Math.min(vh - 6, r.bottom + pad);
    const left = Math.max(6, r.left - pad), right = Math.min(vw - 6, r.right + pad);
    let cy;
    if (vh - bot >= ch + gap + 8) cy = bot + gap;
    else if (top >= ch + gap + 8) cy = top - gap - ch;
    else { cy = vh - ch - 16; bot = Math.max(top + 48, Math.min(bot, cy - gap)); } // tall section: show its top part above the card
    spot.className = "tour-spot";
    Object.assign(spot.style, { top: `${top}px`, left: `${left}px`, width: `${Math.max(0, right - left)}px`, height: `${Math.max(0, bot - top)}px` });
    const cx = Math.min(Math.max(16, (left + right) / 2 - cw / 2), vw - cw - 16);
    card.style.left = `${cx}px`; card.style.top = `${cy}px`;
  }
  $("#tourNext").onclick = () => { if (tourIdx >= TOUR_STEPS.length - 1) endTour(); else showStep(tourIdx + 1); };
  $("#tourBack").onclick = () => { if (tourIdx > 0) showStep(tourIdx - 1); };
  $("#tourSkip").onclick = endTour;
  $("#helpBtn").onclick = startTour;
  document.addEventListener("keydown", e => {
    if (tourIdx < 0) return;
    const rtl = LANG === "ar";
    if (e.key === "Escape") { e.preventDefault(); endTour(); }
    else if (e.key === (rtl ? "ArrowLeft" : "ArrowRight")) { e.preventDefault(); $("#tourNext").click(); }
    else if (e.key === (rtl ? "ArrowRight" : "ArrowLeft")) { e.preventDefault(); $("#tourBack").click(); }
    else if (e.key === "Tab") {
      const f = [...card.querySelectorAll("button")].filter(b => !b.hidden);
      const a = f.indexOf(document.activeElement);
      e.preventDefault(); f[(a + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  let tourRaf = 0;
  const reTour = () => { if (tourIdx < 0) return; cancelAnimationFrame(tourRaf); tourRaf = requestAnimationFrame(placeTour); };
  addEventListener("resize", reTour); addEventListener("scroll", reTour, { passive: true });
  let autoTourAsked = false;
  function maybeAutoTour() {
    if (autoTourAsked) return; autoTourAsked = true;
    let waited = 0;
    const tick = () => {
      if (tourIdx >= 0) return;
      const ready = S.mode === "local" || (docs.settings && docs.settings.loaded);
      if (ready || waited > 6000) { if (!tourSeen()) startTour(); return; }
      waited += 250; setTimeout(tick, 250);
    };
    setTimeout(tick, 400);
  }

  // ================= accounts (Google sign-in via Firebase, used when hosted outside Claude) =================
  const FB_VERSION = "10.12.2";
  const fbConfigured = () => { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && c.projectId && c.authDomain); };
  const loadScript = src => new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  const guestChosen = () => { try { return localStorage.getItem("pt:guest") === "1"; } catch (e) { return false; } };
  function clearLocalData() {
    try { Object.keys(localStorage).filter(k => /^pt:(m-|w-|settings)/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  }
  function resetDocs() {
    Object.keys(docs).forEach(k => { const d = docs[k]; clearTimeout(d.timer); if (d.unsub) d.unsub(); delete docs[k]; });
    Object.keys(yearCache).forEach(k => delete yearCache[k]);
  }
  async function flushAll() {
    for (const k of Object.keys(docs)) { const d = docs[k]; if (d.dirty) { clearTimeout(d.timer); await flush(k); } }
    let n = 0; while (Object.values(docs).some(d => d.writing) && n++ < 40) await new Promise(r => setTimeout(r, 100));
  }
  function renderAccount() {
    const box = $("#acct"); box.hidden = !FB.auth;
    if (!FB.auth) return;
    const b = $("#acctBtn"), u = FB.user;
    b.classList.toggle("signed", !!u);
    b.setAttribute("aria-label", u ? `${tr("acctAria")}: ${u.displayName || u.email || ""}` : tr("signIn"));
    if (u) {
      const ini = (u.displayName || u.email || "?").trim().charAt(0).toUpperCase();
      b.innerHTML = u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : `<span class="ini">${esc(ini)}</span>`;
      const img = b.querySelector("img"); if (img) img.onerror = () => { b.innerHTML = `<span class="ini">${esc(ini)}</span>`; };
      $("#acctName").textContent = u.displayName || ""; $("#acctEmail").textContent = u.email || "";
    } else { b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg><span class="lbl">${tr("signIn")}</span>`; $("#acctMenu").hidden = true; b.setAttribute("aria-expanded", "false"); }
  }
  function openGate() { $("#gateErr").hidden = true; $("#gGoogle").disabled = false; $("#gate").hidden = false; $("#gGoogle").focus(); }
  function closeGate() { $("#gate").hidden = true; }
  async function signInGoogle() {
    const btn = $("#gGoogle"), err = $("#gateErr");
    err.hidden = true; btn.disabled = true;
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try { await FB.auth.signInWithPopup(provider); }
    catch (e) {
      btn.disabled = false;
      const code = e && e.code || "";
      if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
        try { await FB.auth.signInWithRedirect(provider); return; } catch (e2) { err.textContent = tr("signInBlocked"); err.hidden = false; return; }
      }
      err.textContent = tr("signInFail"); err.hidden = false;
      if ($("#gate").hidden) openGate();
    }
  }
  async function switchUser(user) {
    const wasSignedIn = !!FB.user;
    if (wasSignedIn || S.mode === "cloud") await flushAll();
    resetDocs();
    if (user) { FB.user = user; S.backend = "firebase"; S.uid = user.uid; S.mode = "cloud"; closeGate(); }
    else {
      if (wasSignedIn) clearLocalData();
      FB.user = null; S.backend = null; S.uid = null; S.mode = "local";
    }
    renderAccount(); setStatus("saved"); render();
    if (!user && FB.first && !guestChosen()) openGate();
    else if ($("#gate").hidden) maybeAutoTour();
    FB.first = false;
  }
  async function initFirebase() {
    if (!window.firebase) {
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      await loadScript(base + "firebase-app-compat.js");
      await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
    }
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    FB.auth = firebase.auth(); FB.fs = firebase.firestore();
    try { await FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
    FB.auth.getRedirectResult().catch(e => { if (e && e.code) { $("#gateErr").textContent = tr("signInFail"); $("#gateErr").hidden = false; } });
    renderAccount();
    FB.auth.onAuthStateChanged(u => { switchUser(u); });
  }
  $("#gGoogle").onclick = signInGoogle;
  $("#gGuest").onclick = () => { try { localStorage.setItem("pt:guest", "1"); } catch (e) {} closeGate(); maybeAutoTour(); };
  $("#acctBtn").onclick = e => {
    e.stopPropagation();
    if (!FB.user) { openGate(); return; }
    const m = $("#acctMenu"); m.hidden = !m.hidden; $("#acctBtn").setAttribute("aria-expanded", String(!m.hidden));
    if (!m.hidden) $("#signOutBtn").focus();
  };
  document.addEventListener("click", e => { const m = $("#acctMenu"); if (!m.hidden && !e.target.closest(".acct")) { m.hidden = true; $("#acctBtn").setAttribute("aria-expanded", "false"); } });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("#acctMenu").hidden) { $("#acctMenu").hidden = true; $("#acctBtn").setAttribute("aria-expanded", "false"); $("#acctBtn").focus(); }
    else if (!$("#gate").hidden && tourIdx < 0) { $("#gGuest").click(); }
  });
  $("#signOutBtn").onclick = async () => { $("#acctMenu").hidden = true; await flushAll(); await FB.auth.signOut(); };

  // ================= boot =================
  applyStatic(); render();
  (async () => {
    if (!(window.claude && window.claude.use) && fbConfigured()) {
      try { await initFirebase(); return; }
      catch (e) { FB.auth = null; renderAccount(); }
    }
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const uid = user ? await user.id() : null;
        let canWrite = null;
        try { canWrite = user ? await user.can("data.write") : null; } catch (e) {}
        // viewers who can't write to the store (view-only share, outside visitors) keep their data in this browser instead
        if (db && uid && canWrite !== false) { S.db = db; S.uid = uid; S.mode = "cloud"; S.backend = "claude"; }
      }
    } catch (e) {}
    if (S.mode !== "cloud") S.mode = "local";
    setStatus("saved");
    render();
    maybeAutoTour();
  })();
})();
</script>
</body>
</html>
